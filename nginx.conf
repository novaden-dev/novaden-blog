server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Astro writes every page as <route>/index.html, but the site links to
    # <route> with no trailing slash. nginx's default answer to that is a 301
    # to <route>/, spelled as an absolute http:// URL. Behind Cloudflare's TLS
    # that is a different origin from the https page, so the client router
    # abandons the soft swap and does a full page load on every click.
    # Serving the file directly removes the redirect altogether, and relative
    # redirects keep any that remain on the page's own origin.
    absolute_redirect off;

    location / {
        try_files $uri $uri/index.html $uri.html =404;
    }

    error_page 404 /404.html;
}
