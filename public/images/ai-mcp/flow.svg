<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 470" font-family="system-ui, -apple-system, Segoe UI, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>
  <rect width="700" height="470" rx="12" fill="#f8fafc"/>

  <!-- lane headers -->
  <rect x="40" y="20" width="140" height="44" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
  <text x="110" y="40" text-anchor="middle" font-size="15" font-weight="600" fill="#1e293b">Model</text>
  <text x="110" y="56" text-anchor="middle" font-size="12" fill="#475569">the LLM</text>

  <rect x="280" y="20" width="140" height="44" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
  <text x="350" y="40" text-anchor="middle" font-size="15" font-weight="600" fill="#1e293b">Client</text>
  <text x="350" y="56" text-anchor="middle" font-size="12" fill="#475569">inside the shop app</text>

  <rect x="520" y="20" width="140" height="44" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
  <text x="590" y="40" text-anchor="middle" font-size="15" font-weight="600" fill="#1e293b">Server</text>
  <text x="590" y="56" text-anchor="middle" font-size="12" fill="#475569">shop-orders</text>

  <!-- lifelines -->
  <line x1="110" y1="64" x2="110" y2="450" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 4"/>
  <line x1="350" y1="64" x2="350" y2="450" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 4"/>
  <line x1="590" y1="64" x2="590" y2="450" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 4"/>

  <!-- 1 initialize -->
  <line x1="350" y1="96" x2="586" y2="96" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="468" y="88" text-anchor="middle" font-size="12" fill="#1e293b">1. initialize</text>
  <line x1="590" y1="120" x2="354" y2="120" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="468" y="136" text-anchor="middle" font-size="12" fill="#475569">version, capabilities, server name</text>

  <!-- 2 initialized -->
  <line x1="350" y1="168" x2="586" y2="168" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="468" y="160" text-anchor="middle" font-size="12" fill="#1e293b">2. notifications/initialized</text>

  <!-- 3 tools/list -->
  <line x1="350" y1="212" x2="586" y2="212" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="468" y="204" text-anchor="middle" font-size="12" fill="#1e293b">3. tools/list</text>
  <line x1="590" y1="236" x2="354" y2="236" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="468" y="252" text-anchor="middle" font-size="12" fill="#475569">names, descriptions, input schemas</text>

  <!-- 4 descriptions to model -->
  <line x1="346" y1="284" x2="114" y2="284" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="230" y="276" text-anchor="middle" font-size="12" fill="#1e293b">4. tool descriptions</text>
  <text x="230" y="300" text-anchor="middle" font-size="12" fill="#b91c1c">tool poisoning, shadowing</text>

  <!-- 5 model picks a tool -->
  <line x1="114" y1="340" x2="346" y2="340" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="230" y="332" text-anchor="middle" font-size="12" fill="#1e293b">5. call get_order_status(1042)</text>
  <text x="230" y="356" text-anchor="middle" font-size="12" fill="#b91c1c">prompt injection</text>

  <!-- 6 tools/call -->
  <line x1="350" y1="384" x2="586" y2="384" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="468" y="376" text-anchor="middle" font-size="12" fill="#1e293b">6. tools/call</text>
  <line x1="590" y1="408" x2="354" y2="408" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="468" y="424" text-anchor="middle" font-size="12" fill="#475569">result: "shipped"</text>
  <text x="468" y="440" text-anchor="middle" font-size="12" fill="#b91c1c">vulnerable or malicious server</text>

  <!-- 7 result to model -->
  <line x1="346" y1="440" x2="114" y2="440" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="230" y="432" text-anchor="middle" font-size="12" fill="#1e293b">7. result goes to the model</text>
</svg>
